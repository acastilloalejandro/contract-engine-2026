name: Quality
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON schema
        run: node -e "JSON.parse(require('fs').readFileSync('schema/contract-record.schema.json','utf8')); console.log('schema ok')"
      - name: Validate web shells
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for (const file of ['index.html','docs/index.html']) {
            const h=fs.readFileSync(file,'utf8');
            if(!/^<!doctype html>/i.test(h)) throw new Error(file+': missing doctype');
            const tokens=file==='index.html'
              ? ['id="progressBar"','id="nextBtn"','id="generateBtn"']
              : ['id="bar"','id="next"','data-step="3"'];
            for (const token of tokens) if(!h.includes(token)) throw new Error(file+': missing '+token);
            console.log(file+' ok');
          }
          NODE
      - name: Validate JavaScript syntax
        run: for file in js/*.js; do node --check "$file"; done
      - name: Validate iOS project shell
        run: |
          test -f ios/ContractModular.xcodeproj/project.pbxproj
          for file in ContractModularApp.swift Models.swift AppStore.swift DesignSystem.swift DocumentServices.swift AdvancedViews.swift; do
            test -f "ios/ContractModular/$file"
          done
          echo "iOS project shell ok"

name: form-quality
on:
  push:
    branches: ["main","feat/worker-form-100q"]
  pull_request:
    branches: ["main"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tests/form100-check.js
